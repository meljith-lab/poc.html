function tlAdd(msg, cls) {
  var tl = document.getElementById('timeline');
  if (!tl) return;
  var li = document.createElement('li');
  li.className = cls || 'done';
  li.innerHTML = '<span class="ts">' + new Date().toLocaleTimeString() + '</span> <span class="msg">' + esc(msg) + '</span>';
  tl.appendChild(li);
}
